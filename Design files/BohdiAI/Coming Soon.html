<style>
  html, body { background: #f7f1e6; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    color: #2a241c;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .font-serif { font-feature-settings: "ss01", "ss02"; }
  /* Subtle paper grain */
  .paper {
    background-color: #f7f1e6;
    background-image:
      radial-gradient(rgba(86, 73, 59, 0.06) 1px, transparent 1px),
      radial-gradient(rgba(86, 73, 59, 0.04) 1px, transparent 1px);
    background-size: 22px 22px, 11px 11px;
    background-position: 0 0, 11px 11px;
  }
  .paper-dark {
    background-color: #1a1410;
    background-image:
      radial-gradient(rgba(233, 178, 87, 0.05) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  /* Quiet underline link */
  .link-underline {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 100% 1px;
    background-repeat: no-repeat;
    background-position: 0 100%;
    transition: background-size 0.3s ease;
  }
  .link-underline:hover { background-size: 0% 1px; }
  /* Animated entries */
  @keyframes rise {
    0% { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .rise { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  /* Marquee fade */
  @keyframes fadeSwap {
    0%, 100% { opacity: 0; transform: translateY(8px); }
    12%, 88% { opacity: 1; transform: translateY(0); }
  }
  /* Custom focus */
  .focus-ring:focus { outline: 2px solid #d99634; outline-offset: 2px; }
  /* Form inputs */
  .input {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #c9b58e;
    padding: 14px 2px 10px;
    font-size: 17px;
    color: #1f1a14;
    transition: border-color 0.2s ease;
  }
  .input::placeholder { color: #a39378; }
  .input:focus { outline: none; border-bottom-color: #1f1a14; }
  textarea.input { resize: none; min-height: 64px; }
  /* Button shimmer */
  .btn-primary {
    background: #1f1a14;
    color: #fbf8f2;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn-primary:hover { background: #2a241c; }
  .btn-primary:active { transform: translateY(1px); }
  /* Honey rule */
  .honey-rule {
    height: 1px;
    background: linear-gradient(to right, transparent, #d99634, transparent);
  }
  /* Pill */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #f7f1e6;
    border: 1px solid #e3d3b1;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #56493b;
  }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 999px; background: #d99634;
    box-shadow: 0 0 0 4px rgba(217, 150, 52, 0.15);
  }
  /* Card lift */
  .card {
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 30px 60px -28px rgba(31, 26, 20, 0.25);
  }
  /* Hide scrollbar utility */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
