- slug: florist
  display_name: Florist
  tenant_type_fit: [seller, doer]
  priority: P0
  status: pending
  notes: Retail arrangements (seller) plus wedding and event work (doer).
    Often takes standing-order and subscription business. Common
    specializations are wedding, event, daily arrangements, dried.

- slug: tutor
  display_name: Tutor
  tenant_type_fit: [doer]
  priority: P0
  status: pending
  notes: Academic tutoring — math, science, English, languages, SAT/ACT
