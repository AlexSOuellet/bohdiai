# BohdiAI niche launch queue
#
# Candidate niches for niche-writer to draft, in priority order for launch.
# Read top to bottom — the most important entries come first. If we get to
# them all, great. If we don't, the launch-critical ones are at the top.
#
# Fields:
#   slug             — short identifier used as the niches table primary key
#   display_name     — customer-facing label shown in the onboarding picker
#                      (person/role form, not entity form — "Baker" not "Bakery")
#   tenant_type_fit  — [seller], [doer], or [seller, doer]
#   priority         — P0 must-have, P1 ship if we can, P2 nice-to-have
#   status           — done, pending, in_progress, skip
#   notes            — context for whoever picks this entry up
#
# Edit freely. Mark "skip" to remove an entry from the agent queue. Bump
# entries up or down as you re-read.

# ============================================================
# P0 — must-have at launch
# ============================================================
# The dozen-plus niches that span the full audience (solo makers, Etsy
# refugees, craft-fair sellers, service providers, hybrid businesses).
# Without these the platform's claim to range isn't validated.

- slug: candles
  display_name: Candle Maker
  tenant_type_fit: [seller]
  priority: P0
  status: done
  notes: Reference niche. Drafted by hand, used as example for niche-writer.

- slug: jewelry_maker
  display_name: Jewelry Maker
  tenant_type_fit: [seller]
  priority: P0
  status: done
  notes: The most-cited Etsy category. Spans personalized name pieces,
    silversmith and goldsmith work, beadwork, polymer clay, gemstones,
    resin, hand-stamped metal. Concerns center on metal type, allergens,
    sizing, gift packaging.

- slug: baker
  display_name: Baker
  tenant_type_fit: [seller, doer]
  priority: P0
  status: done
  notes: Cottage-food bakers, custom-cake makers, sourdough specialists,
    wedding cake makers. Retail plus custom orders. Often teaches classes.
    Huge population at the kitchen-table-maker tier.

- slug: photographer
  display_name: Photographer
  tenant_type_fit: [doer, seller]
  priority: P0
  status: pending
  notes: Portrait, wedding, newborn, family, brand, real estate, product,
    pet. One niche at launch — may split sub-segments later. Seller side
    for prints and digital products.

- slug: hair_stylist
  display_name: Hair Stylist
  tenant_type_fit: [doer]
  priority: P0
  status: pending
  notes: Independent stylists (booth-renters, home-studio, mobile). Color
    work and longer appointments differentiate from barbers. Common
    specializations are color, extensions, bridal, kids.

- slug: soap_and_bath
  display_name: Soap & Bath Maker
  tenant_type_fit: [seller]
  priority: P0
  status: done
  notes: Cold-process and melt-and-pour soap, bath bombs, body butters,
    scrubs, lotions, salts. Closely adjacent to candles. Concerns are
    ingredients, skin sensitivity, scent, curing time for cold-process.

- slug: ceramicist
  display_name: Ceramicist / Potter
  tenant_type_fit: [seller, doer]
  priority: P0
  status: done
  notes: Mugs, bowls, vases, planters, custom commissions. Often teaches
    classes (doer side). Classic Seller+Doer hybrid validator.

- slug: woodworker
  display_name: Woodworker
  tenant_type_fit: [seller, doer]
  priority: P0
  status: done
  notes: Cutting boards, turned bowls, custom signs, kids' toys, decor,
    cabinetry, furniture commissions. Schema tends to include wood
    species, finish, food-safety status. Common specializations are
    cutting boards, furniture, signs, toys.

- slug: tattoo_artist
  display_name: Tattoo Artist
  tenant_type_fit: [seller, doer]
  priority: P0
  status: pending
  notes: Doer is primary identity (appointment-driven). Seller side for
    flash designs, prints, merch, gift cards. Often booth-renting.
    Subcultural audience validator.

- slug: dog_groomer
  display_name: Dog Groomer
  tenant_type_fit: [doer]
  priority: P0
  status: pending
  notes: Independent groomers, mobile groomers, small shops. Appointment-
    driven, often booked out weeks. Cut photography is portfolio.

- slug: fine_artist
  display_name: Fine Artist / Painter
  tenant_type_fit: [seller, doer]
  priority: P0
  status: done
  notes: Watercolor, oil, acrylic, mixed media. Original works for sale
