name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values so env validation passes. Tests mock the network with
      # page.route(), so no real Supabase / Resend / Anthropic / fal calls are made.
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      RESEND_API_KEY: ci-dummy-resend-key
      RESEND_FROM_EMAIL: ci@bohdiai.com
      SITE_URL: http://localhost:3100
      FOUNDER_CAP: '25'
      BOHDIAI_ANTHROPIC_KEY: ci-dummy-anthropic-key
      FAL_API_KEY: ci-dummy-fal-key
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage (Vitest)
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
